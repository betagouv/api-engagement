# POC Keep (alerting) — local uniquement. Voir README.md.
name: keep-poc


services:
  keep-db:
    image: postgres:16
    environment:
      POSTGRES_USER: keep
      POSTGRES_PASSWORD: keep
      POSTGRES_DB: keep
    volumes:
      - keep-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keep"]
      interval: 5s
      timeout: 3s
      retries: 10

  keep-backend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api:0.54.3
    depends_on:
      keep-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      AUTH_TYPE: DB
      KEEP_JWT_SECRET: poc-jwt-secret
      KEEP_DEFAULT_USERNAME: keep
      KEEP_DEFAULT_PASSWORD: keep
      DATABASE_CONNECTION_STRING: postgresql+psycopg2://keep:keep@keep-db:5432/keep
      SECRET_MANAGER_TYPE: FILE
      SECRET_MANAGER_DIRECTORY: /state
      PUSHER_APP_ID: "1"
      PUSHER_APP_KEY: keepappkey
      PUSHER_APP_SECRET: keepappsecret
      PUSHER_HOST: keep-websocket-server
      PUSHER_PORT: "6001"
      POSTHOG_DISABLED: "true"
      SENTRY_DISABLED: "true"
      USE_NGROK: "false"
    volumes:
      - keep-state:/state
      - ./workflows:/workflows:ro

  keep-frontend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-ui:0.54.3
    depends_on:
      - keep-backend
    ports:
      # 3000 est pris par le back-office (app/)
      - "3100:3000"
    environment:
      AUTH_TYPE: DB
      NEXTAUTH_SECRET: poc-nextauth-secret
      NEXTAUTH_URL: http://localhost:3100
      API_URL: http://keep-backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_POSTHOG_DISABLED: "true"
      POSTHOG_DISABLED: "true"
      SENTRY_DISABLED: "true"
      PUSHER_HOST: localhost
      PUSHER_PORT: "6001"
      PUSHER_APP_KEY: keepappkey

  keep-websocket-server:
    image: quay.io/soketi/soketi:1.4-16-debian
    ports:
      - "6001:6001"
    environment:
      SOKETI_DEFAULT_APP_ID: "1"
      SOKETI_DEFAULT_APP_KEY: keepappkey
      SOKETI_DEFAULT_APP_SECRET: keepappsecret

  # SMTP de test : UI sur http://localhost:8025, SMTP sur mailpit:1025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  keep-db:
  keep-state:
