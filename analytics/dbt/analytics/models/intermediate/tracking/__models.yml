version: 2

models:
  - name: int_internal_distinct_ids
    description: >
      Référentiel des `distinct_id` internes (équipe API Engagement) : liste des identifiants ayant émis au moins
      un event avec `internal_user = true`. L'internalité est résolue au niveau de la PERSONNE (et non de l'event
      ni de la session) : dès qu'un `distinct_id` s'est flagué `?internal=1`, tous ses events sont considérés
      internes, y compris ceux antérieurs au flag. Ce référentiel est la source UNIQUE de l'exclusion interne,
      appliquée uniformément à tous les intermédiaires tracking via la macro `exclude_internal_distinct_ids`.
    columns:
      - name: distinct_id
        description: Identifiant PostHog d'une personne interne.
        tests:
          - not_null
          - unique

  - name: int_tracking_quiz_session
    description: >
      Colonne vertébrale du tracking : une ligne par `quiz_attempt_id`. Agrège tout le tunnel (started, steps,
      completed), résout `quiz_session_id` et porte les flags de complétion. Porte aussi la géo DÉCLARÉE au quiz
      (étape `localisation`), enrichie du département et de la région via le seed `department_codes`. Les personnes
      internes sont exclues au niveau du `distinct_id` (référentiel `int_internal_distinct_ids`).
      PIÈGE DE GRAIN : la géo n'existe que pour les tentatives ayant atteint l'étape `localisation` (les abandons
      antérieurs ont les colonnes géo à null) ; les analyses d'abandon par géo ne sont valides qu'à partir de
      cette étape.
    columns:
      - name: quiz_attempt_id
        description: UUID de la tentative de quiz.
        tests:
          - not_null
          - unique
      - name: quiz_session_id
        description: Identifiant backend (`userScoringId`), présent si le quiz a été complété.
      - name: quiz_version
        description: Version du quiz au démarrage de la tentative.
      - name: is_completed
        description: Vrai si un événement `quiz.completed` a été observé pour la tentative.
      - name: postcode
        description: Code postal DÉCLARÉ à l'étape `localisation`. Null avant cette étape.
      - name: geo_lat
        description: Latitude déclarée à l'étape `localisation`. Nullable.
      - name: geo_lon
        description: Longitude déclarée à l'étape `localisation`. Nullable.
      - name: country_code
        description: Code pays déclaré à l'étape `localisation` (ex. `fr`). Nullable.
      - name: department_code
        description: >
          Département dérivé du code postal (gère Outre-mer et Corse, approximatif pour la Corse).
          Nullable ou hors référentiel si saisie hors périmètre code postal FR.
      - name: department_name
        description: Nom du département (jointure seed `department_codes`). Nullable.
      - name: region_code
        description: Code région INSEE 2016 (jointure seed `department_codes`). Nullable.
      - name: region_name
        description: Nom de la région INSEE 2016 (jointure seed `department_codes`). Nullable.

  - name: int_tracking_quiz_funnel_step
    description: >
      Séquence des étapes validées, une ligne par (`quiz_attempt_id`, étape). Base du taux d'abandon
      étape N / N-1. Personnes internes exclues au niveau du `distinct_id`.
    columns:
      - name: quiz_attempt_id
        tests:
          - not_null
      - name: step_name
        tests:
          - not_null

  - name: int_tracking_results_session
    description: >
      Vue « résultats + aval » par `quiz_session_id` : combine `results.viewed` avec les clics mission de la
      session (taux de clic, clic pinned, clic externe, zéro-clic). Personnes internes exclues au niveau du `distinct_id`.
    columns:
      - name: quiz_session_id
        tests:
          - not_null
          - unique
      - name: is_zero_click
        description: Vrai si la session a vu des résultats sans aucun clic mission.

  - name: int_tracking_mission_click
    description: >
      Chaque clic mission enrichi (rang, section, distance, publisher), une ligne par événement `mission.clicked`.
      Réconcilié avec le backend via `quiz_session_id` = `user_scoring_id` et le pont `mission_scoring`
      (`results[i].missionScoringId` = `mission_scoring.id` -> `mission_id`) : expose le rang attribué à la
      mission cliquée par le run de matching actif au moment du clic (dernier `created_at` <= `clicked_at`).
      `mission_score` reste un placeholder (le score total de classement n'est pas persisté dans `results`).
      Personnes internes exclues au niveau du `distinct_id`.
    columns:
      - name: event_uuid
        tests:
          - not_null
          - unique
      - name: mission_id
        description: Identifiant de la mission cliquée (text ; formats mixtes ObjectId Mongo / UUID).
        tests:
          - not_null
      - name: backend_rank
        description: >
          Rang de la mission dans le run de matching actif au moment du clic (dernier `created_at` <=
          `clicked_at`), position dans `results`. Null si le clic n'a pas pu être rattaché au backend.
      - name: matching_engine_version
        description: Version du moteur de matching du run rattaché (nullable si non rattaché).
      - name: matched_to_backend
        description: Vrai si le clic a été rattaché à une mission du résultat de matching de la session.
      - name: mission_score
        description: >
          Score de la mission cliquée = moyenne de ses `taxonomyScores` dans le run de matching actif au
          clic. Même base que `score_top5` (sous-score thématique), donc PAS le score total pondéré géo
          (non persisté). Null si le clic n'est pas réconcilié au backend (`matched_to_backend = false`).

  - name: int_tracking_backend_conversion
    description: >
      Attribution backend d'une session quiz (`quiz_session_id` = `user_scoring_id`) : clics sortants
      trackés côté `stat_event` (porteurs de `custom_attributes.user_scoring_id`) et candidatures (`apply`)
      rattachées via `apply.click_id = click.stat_event_id`. Bots exclus. Une ligne par session ayant
      au moins un clic backend.
    columns:
      - name: quiz_session_id
        tests:
          - not_null
          - unique
      - name: backend_click_count
        description: Nombre de clics backend trackés pour la session.
      - name: apply_count
        description: Nombre de candidatures rattachées aux clics backend de la session.
      - name: has_apply
        description: Vrai si au moins une candidature a été rattachée.

  - name: int_tracking_quiz_backend
    description: >
      Réconciliation d'une session quiz avec le backend via `quiz_session_id` = `user_scoring_id`.
      `score_top5` est la moyenne des `taxonomyScores` des 5 premiers résultats du dernier run de
      matching (`matching_engine_result` le plus récent par `user_scoring_id`, plusieurs runs possibles).
      Les métriques de conversion backend (clics sortants et candidatures) sont issues de
      `int_tracking_backend_conversion`. Personnes internes exclues au niveau du `distinct_id`.
    columns:
      - name: quiz_session_id
        tests:
          - not_null
          - unique
      - name: score_top5
        description: >
          Moyenne des `taxonomyScores` sur le top 5 des résultats du dernier run de matching de la
          session. Null si aucun `matching_engine_result` exploitable.
      - name: has_backend_click
        description: Vrai si la session a au moins un clic sortant tracké côté `stat_event`.
      - name: has_apply
        description: Vrai si au moins une candidature a été rattachée aux clics backend de la session.
      - name: apply_count
        description: Nombre de candidatures rattachées aux clics backend de la session.

  - name: int_tracking_recommendation
    description: >
      Missions recommandées par le moteur de matching, une ligne par mission du DERNIER run de chaque
      session quiz (`user_scoring_id`). Source : `stg_matching_engine_result.results` (tableau JSON de
      `missionScoringId`). Pont vers la mission puis l'annonceur via `mission_scoring`
      (`results[i].missionScoringId` = `mission_scoring.id` -> `mission_id`), puis `mission.publisher_id`
      -> `publisher.name`. Usage : KPI de contrôle « part des recommandations par annonceur » (détecter
      qu'un seul annonceur capte l'essentiel des recommandations). Personnes internes exclues au niveau
      du `distinct_id`. `mission_id` en `text` (formats mixtes ObjectId Mongo / UUID), jamais casté.
    columns:
      - name: quiz_session_id
        description: Session quiz (`user_scoring_id`) du run de matching.
        tests:
          - not_null
      - name: mission_id
        description: Mission recommandée (text ; formats mixtes ObjectId Mongo / UUID).
        tests:
          - not_null
      - name: publisher_id
        description: Annonceur propriétaire de la mission recommandée.
        tests:
          - not_null
      - name: backend_rank
        description: Rang de la mission dans le run de matching (position dans `results`).

  - name: int_tracking_page_view
    description: >
      Visites de pages filtrées (personnes internes exclues au niveau du `distinct_id`), une ligne par événement `page.viewed`. Alimente le trafic
      quotidien agrégé (`page_view_daily`).
    columns:
      - name: event_uuid
        tests:
          - not_null
          - unique
      - name: page_name
        tests:
          - not_null
