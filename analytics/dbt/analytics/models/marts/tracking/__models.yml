version: 2

models:
  - name: tracking_quiz_session
    description: >
      Fait session (grain `quiz_attempt_id`) exposé à Metabase. Fusionne le tunnel, les résultats et le backend.
      Sert aussi de base aux distributions (statut, motivation, age_bracket) par `group by`.
      ATTENTION périmètre implicite : tous les flags de clic ci-dessous ne concernent QUE les sessions
      ayant vu les résultats (`results.viewed`). Ils proviennent de `int_tracking_results_session`, piloté
      par les events `results.viewed`, les clics n'étant greffés qu'en `left join`. Une session sans
      `results.viewed` retombe donc à `false` sur ces flags même si un clic existait hors parcours résultats.
      Porte aussi la géo DÉCLARÉE au quiz (`postcode`, `geo_lat`, `geo_lon`, `country_code`, `department_code`,
      `department_name`, `region_code`, `region_name`). PIÈGE DE GRAIN : la géo n'existe qu'à partir de l'étape
      `localisation` ; les tentatives abandonnées avant ont ces colonnes à null (analyses d'abandon par géo
      valides seulement à partir de cette étape).
    columns:
      - name: quiz_attempt_id
        tests:
          - not_null
          - unique
      - name: quiz_session_id
        description: Identifiant backend, présent pour les sessions complétées.
      - name: postcode
        description: Code postal DÉCLARÉ à l'étape `localisation` (géo quiz, pas GeoIP). Nullable.
      - name: geo_lat
        description: Latitude déclarée à l'étape `localisation`. Nullable.
      - name: geo_lon
        description: Longitude déclarée à l'étape `localisation`. Nullable.
      - name: country_code
        description: Code pays déclaré à l'étape `localisation` (ex. `fr`). Nullable.
      - name: department_code
        description: Département dérivé du code postal (Corse approximative, Outre-mer géré). Nullable.
      - name: department_name
        description: Nom du département (seed `department_codes`). Nullable.
      - name: region_code
        description: Code région INSEE 2016 (seed `department_codes`). Nullable.
      - name: region_name
        description: Nom de la région INSEE 2016 (seed `department_codes`). Nullable.
      - name: quiz_version
        description: Version du quiz au démarrage de la tentative.
      - name: has_click_after_results
        description: >
          Vrai si la session a vu les résultats ET a cliqué sur au moins une mission (toutes sections
          confondues). NB : « a vu les résultats ET a cliqué », pas « a cliqué » tout court — d'où le
          renommage depuis l'ancien `has_click`, trompeur.
      - name: has_click_results
        description: >
          Vrai si la session a vu les résultats et a cliqué avec `entry_page = 'results'` (clic depuis la
          page de résultats). Numérateur du taux de clic sur les résultats.
      - name: has_click_pinned
        description: Vrai si, parmi les clics de la session, au moins un porte sur une mission pinned.
      - name: has_click_external
        description: Vrai si, parmi les clics de la session, au moins un ouvre une candidature externe.
      - name: is_zero_click
        description: Vrai si la session a vu les résultats sans aucun clic mission.

  - name: tracking_mission_click
    description: >
      Fait clic mission (grain événement) pour les breakdowns rang / distance / section / publisher,
      enrichi du statut et de la tranche d'âge de la session. Réconcilié avec le moteur de matching :
      `backend_rank`, `matching_engine_version` et `matched_to_backend` permettent d'analyser le CTR par rang.
      `mission_score` porte le score de la mission cliquée (répartition des clics par score).
    columns:
      - name: event_uuid
        tests:
          - not_null
          - unique
      - name: mission_score
        description: >
          Score de la mission cliquée = moyenne de ses `taxonomyScores` dans le run de matching actif au
          clic. Même base que `score_top5` (sous-score thématique), donc PAS le score total pondéré géo
          (non persisté). Null si le clic n'est pas réconcilié au backend (`matched_to_backend = false`).

  - name: tracking_page_view_daily
    description: >
      Trafic quotidien par page (`page_name`). Dénominateur des ratios d'acquisition (ex. taux de démarrage
      du quiz depuis la home).
    columns:
      - name: kpi_date
        tests:
          - not_null
      - name: page_name
        tests:
          - not_null

  - name: tracking_funnel_step_daily
    description: >
      Funnel quotidien : sessions atteignant chaque étape, taux de rétention étape N / N-1 et taux d'atteinte
      global depuis `quiz.started`.
    columns:
      - name: kpi_date
        tests:
          - not_null

  - name: tracking_engagement_kpi_daily
    description: >
      Rollup quotidien des KPIs de succès et d'activité (complétion, conversion quiz → clic, accès annonceurs,
      raccourci, changement de résultats, taux de démarrage depuis la home).
    columns:
      - name: kpi_date
        tests:
          - not_null
          - unique
      - name: sessions_with_click_after_results
        description: >
          Nombre de sessions ayant vu les résultats ET cliqué sur au moins une mission (renommé depuis
          `sessions_with_click`). Ne compte pas les clics hors parcours résultats.
      - name: quiz_to_click_rate
        description: >
          Taux `sessions_with_click_after_results / quiz_started_count`. ATTENTION : numérateur et
          dénominateur portent sur des populations différentes — le numérateur ne couvre que les sessions
          ayant vu les résultats et cliqué, le dénominateur toutes les sessions démarrées. C'est assumé :
          il s'agit du taux de sessions démarrées qui vont jusqu'à voir les résultats ET cliquer, pas d'un
          simple taux de clic sur une population homogène.

  - name: tracking_scoring_kpi_daily
    description: >
      Rollup quotidien de la qualité des recommandations : clic pinned, zéro-clic, distance et score moyens du
      top 5, répartition des clics par rang.
    columns:
      - name: kpi_date
        tests:
          - not_null
          - unique

  - name: tracking_recommendation
    description: >
      Fait « une ligne par mission recommandée » (dernier run de matching de chaque session), exposé à
      Metabase pour le KPI de contrôle « part des recommandations par annonceur ». Pas de pré-agrégation :
      agréger librement par `publisher_name`, `session_date` ou `backend_rank`. Voir
      `int_tracking_recommendation` pour la chaîne de jointure (pont `mission_scoring` -> mission ->
      publisher). Personnes internes exclues au niveau du `distinct_id`.
    columns:
      - name: quiz_session_id
        description: Session quiz (`user_scoring_id`) du run de matching.
        tests:
          - not_null
      - name: mission_id
        description: Mission recommandée (text ; formats mixtes ObjectId Mongo / UUID).
        tests:
          - not_null
      - name: publisher_id
        description: Annonceur propriétaire de la mission recommandée.
        tests:
          - not_null
      - name: publisher_name
        description: Nom de l'annonceur, pour l'agrégation « part par annonceur » côté Metabase.
      - name: backend_rank
        description: Rang de la mission dans le run de matching (position dans `results`).

  - name: tracking_publisher_stock_share
    description: >
      KPIs de contrôle « relatif au stock » : par annonceur, croise le stock de missions diffusables sur la
      Plateforme de l'Engagement (`mission_diffusion` filtré sur le diffuseur PDE, id figé en var
      `PUBLISHER_PLATEFORME_ENGAGEMENT_ID`, `deleted_at is null`) avec les recommandations
      (`int_tracking_recommendation`) et les clics (`int_tracking_mission_click`) du quiz. Grain : une ligne
      par annonceur présent dans le stock diffusable PDE. PIÈGE flux vs stock : le stock est l'état COURANT
      (miroir `mission_diffusion`), les recos/clics sont cumulés sur tout l'historique ; un alignement
      temporel plus fin (stock à une date T via `created_at`/`deleted_at`) est une amélioration ultérieure.
    columns:
      - name: publisher_id
        description: Annonceur (propriétaire des missions).
        tests:
          - not_null
          - unique
      - name: publisher_name
        description: Nom de l'annonceur (jointure `stg_publisher`).
      - name: stock_mission_count
        description: Nombre de missions distinctes de l'annonceur diffusables sur la PDE (stock courant).
      - name: reco_count
        description: Nombre de missions recommandées appartenant à l'annonceur.
      - name: click_count
        description: Nombre de clics sur des missions de l'annonceur.
      - name: stock_share
        description: Part du stock diffusable PDE détenue par l'annonceur.
      - name: reco_vs_stock_index
        description: >
          Part des recommandations ÷ part du stock. >1 = annonceur sur-représenté dans les recos par
          rapport à son offre diffusable, <1 = sous-représenté.
      - name: click_vs_stock_index
        description: >
          Part des clics ÷ part du stock. >1 = les missions de l'annonceur captent plus de clics que ne
          le laisserait attendre son offre diffusable.
  - name: tracking_matching_engine_ranking_daily
    description: >
      Position moyenne quotidienne des missions recommandées cliquées, au grain date du clic + version du moteur.
      Les compteurs et la somme des rangs permettent de recalculer une moyenne pondérée fiable sur une période
      quelconque dans Metabase. Les clics non rattachés sont conservés sous la version `unknown` pour mesurer la
      couverture du rapprochement.
    columns:
      - name: click_date
        description: Date du clic sur la mission recommandée.
        tests:
          - not_null
      - name: matching_engine_version
        description: Version du moteur rattachée au clic ; vaut `unknown` lorsque le rattachement est impossible.
        tests:
          - not_null
      - name: result_click_count
        description: Nombre total de clics sur les résultats `pinned` ou `other`.
        tests:
          - not_null
      - name: matched_result_click_count
        description: Nombre total de clics de résultats rattachés à un rang du moteur.
        tests:
          - not_null
      - name: clicked_matching_engine_rank_sum
        description: >
          Numérateur additif de la position moyenne de tous les clics. Pour une période, diviser sa somme par la
          somme de `matched_result_click_count` plutôt que de moyenner les valeurs quotidiennes.
      - name: avg_clicked_matching_engine_rank
        description: >
          Position moyenne dans le classement du moteur de tous les clics rattachés du jour et de la version ; plus
          la valeur est basse, mieux les missions cliquées sont classées.
      - name: all_clicks_matching_engine_match_rate
        description: Part de l'ensemble des clics de résultats rattachés à un rang du moteur.

  - name: tracking_campaign_session
    description: >
      Fait session (grain `tracking_session_id`) du suivi des campagnes sur Trouve Ta Mission, exposé à
      Metabase pour le drill-down (une ligne par session avec `landing_url`, UTM bruts, `gclid`,
      `attribution_method`). Part de `int_tracking_session` (atterrissage sur TTM, quiz lancé ou non) et
      rattache la session à une campagne du référentiel `int_tracking_campaign` (API, Adwords, Meta,
      emailing…) par deux méthodes, dans cet ordre : (1) `click_id` = `landing_click_id`
      (`?apiengagement_id=` posé par la redirection `/r/campaign/`) joint sur le mart `click` avec
      `source = 'campaign'`, robuste et indépendant des UTM et du consentement, campagnes API uniquement ;
      (2) `utm` en repli = triplet (`utm_source`, `utm_campaign`, `utm_medium`) de la session comparé, en
      `lower()` et null-safe, au triplet du référentiel (campagne API active d'abord, puis la plus récente).
      Le repli couvre les liens partagés sans `/r/campaign/`, les campagnes API dont l'URL a changé, et toutes
      les campagnes non API (SEA…), qui n'ont ni lien tracké ni `apiengagement_id`. L'attribution est prise
      sur le PREMIER événement de la session. Les UTM sont gardés bruts (une session de scanner avec
      `utm_source` en `javascript:` reste hors campagne, sans nettoyage supplémentaire).
      DEUX MESURES DE CLIC À NE PAS CONFONDRE : `front_mission_click_count` = événement PostHog
      `mission.clicked` (clic sur une carte, vers la fiche ou un lien externe) ; `backend_click_count` =
      clic API de sortie vers l'annonceur (`stat_event` porteur de `custom_attributes.user_scoring_id`), seule
      vraie redirection. Les candidatures (`apply_count`) sont rattachées via ces clics backend, donc
      UNIQUEMENT via le parcours quiz : les clics API sans `user_scoring_id` (parcours `/missions` hors quiz,
      exemples de la home) ne sont reliables à aucune session et sont hors périmètre. Compteurs à 0 et flags à
      `false` (jamais null) en l'absence de conversion. Personnes internes exclues au niveau du `distinct_id`.
    columns:
      - name: tracking_session_id
        tests:
          - not_null
          - unique
      - name: campaign_key
        description: >
          `coalesce(campaign_key_from_click, campaign_key_from_utm)` : id de campagne API ou
          `utm:source|medium|campaign`. Null si la session n'est rattachée à aucune campagne.
      - name: campaign_type
        description: >
          Canal de la campagne attribuée (`api`, `adwords`, `meta`, `emailing`, `utm`), null hors campagne.
          Une campagne API sortie du périmètre du référentiel (URL modifiée) reste typée `api`.
        tests:
          - accepted_values:
              arguments:
                values: ['api', 'adwords', 'meta', 'emailing', 'utm']
      - name: campaign_name
        description: Nom de la campagne (back-office ou `utm_campaign`), null hors campagne.
      - name: api_campaign_id
        description: Id de la campagne API, pour rejoindre le back-office. Null hors type `api`.
      - name: attribution_method
        description: >
          `click_id` si rattachée par l'`apiengagement_id` de l'URL d'arrivée, `utm` si par le triplet UTM,
          null hors campagne. Priorité `click_id` > `utm`.
        tests:
          - accepted_values:
              arguments:
                values: ['click_id', 'utm']
      - name: is_from_campaign
        description: Vrai si `campaign_key` est non null.
      - name: gclid
        description: >
          Identifiant de clic Google Ads vu dans la session (auto-tagging). Opaque, sert de marqueur
          « trafic Google payant » même sans UTM ; rapprochement clic à clic possible plus tard si un export
          Google Ads est importé. Idem `fbclid` pour Meta.
      - name: front_mission_click_count
        description: Nombre de `mission.clicked` PostHog (clic carte). Pas la redirection vers l'annonceur.
      - name: backend_click_count
        description: >
          Nombre de clics API de sortie vers l'annonceur rattachés aux `quiz_session_ids` de la session.
          Bots exclus. 0 si aucun.
      - name: backend_clicked_mission_count
        description: Nombre de missions distinctes visées par les clics backend de la session.
      - name: apply_count
        description: >
          Nombre de candidatures rattachées aux clics backend (`apply.click_id`). Uniquement via le parcours
          quiz. 0 si aucune.
      - name: has_apply
        description: Vrai si `apply_count > 0` ; implique `has_backend_click`.

  - name: tracking_campaign_funnel_daily
    description: >
      Tunnel quotidien par campagne (arrivée → quiz → clic mission → candidature), grain
      (`kpi_date`, `campaign_key`), tous canaux confondus. Table à brancher directement dans Metabase :
      filtrer ou agréger par `campaign_type` (api, adwords, meta, emailing, utm), `campaign_name`, ou croiser
      `utm_source` × `utm_medium` × `utm_campaign` ; sommer `sessions`, `sessions_quiz_completed`,
      `sessions_backend_click`, `sessions_apply` et dériver les taux (aucun ratio calculé ici). Le grain jour
      permet les comparaisons de périodes natives de Metabase. Les sessions hors campagne (`campaign_key`
      null, `campaign_type` = `none`, `campaign_name` = « Hors campagne ») sont conservées comme base de
      comparaison. UTM : ce sont ceux de RÉFÉRENCE de la campagne (URL du lien tracké pour l'API, triplet
      observé pour les autres), pas les UTM bruts de chaque session (voir `tracking_campaign_session`) ; une
      campagne API sans UTM dans son URL a ces colonnes à null, d'où l'importance de mettre des UTM dans tous
      les liens trackés.
      DÉNOMINATEUR HORS POSTHOG VS SOUS-ENSEMBLE TRACKÉ : `origin_clicks` = clics comptés par la plateforme
      d'origine, indépendamment du consentement PostHog. Renseigné pour les campagnes API (redirections
      `/r/campaign/`, mart `click`, hors bots, 0 si aucun clic ce jour-là), null pour les autres types tant
      qu'aucun export (Google Ads, Meta) n'est importé ; pour ces canaux, le dénominateur est dans la console
      de la plateforme. `sessions` compte les sessions PostHog attribuées, normalement un sous-ensemble.
      `sessions` peut dépasser `origin_clicks` sur un jour (1) quand des sessions sont attribuées par UTM
      sans être passées par `/r/campaign/` (lien partagé, URL de campagne recopiée) ou (2) quand la même URL
      d'atterrissage, avec son `apiengagement_id`, est ouverte par plusieurs navigateurs (cas observé : QR
      code, 2 personnes par clic). Full outer join sessions × clics API : un jour avec clics sans session
      trackée (ou l'inverse) apparaît quand même, compteurs à 0.
      Comme dans `tracking_campaign_session` : `sessions_front_mission_click` = clic carte PostHog,
      `sessions_backend_click` = redirection API vers l'annonceur, `sessions_apply` uniquement via le parcours
      quiz.
    columns:
      - name: kpi_date
        description: Date de l'atterrissage (sessions) ou du clic API (`origin_clicks`), en UTC.
        tests:
          - not_null
      - name: campaign_key
        description: Id de campagne API ou `utm:source|medium|campaign`. Null pour les sessions hors campagne.
      - name: campaign_type
        description: Canal (`api`, `adwords`, `meta`, `emailing`, `utm`), `none` hors campagne.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['api', 'adwords', 'meta', 'emailing', 'utm', 'none']
      - name: campaign_name
        description: Nom de la campagne, « Hors campagne » si `campaign_key` est null.
        tests:
          - not_null
      - name: api_campaign_id
        description: Id de la campagne API (jointure back-office). Null hors type `api`.
      - name: utm_source
        description: >
          UTM de référence de la campagne (pas ceux des sessions). Null hors campagne ou si le lien tracké
          n'en porte pas. Idem `utm_medium`, `utm_campaign`.
      - name: origin_clicks
        description: >
          Clics comptés par la plateforme d'origine, hors PostHog : redirections `/r/campaign/` pour les
          campagnes API (0 si aucun ce jour-là), null pour les autres types.
      - name: sessions
        description: Sessions PostHog attribuées à la campagne (sous-ensemble tracké).
      - name: sessions_backend_click
        description: Sessions avec au moins un clic API de sortie vers l'annonceur.
      - name: sessions_apply
        description: Sessions avec au moins une candidature (via clic backend, parcours quiz uniquement).
      - name: backend_clicks
        description: Somme des `backend_click_count` des sessions du jour.
      - name: applies
        description: Somme des `apply_count` des sessions du jour.
