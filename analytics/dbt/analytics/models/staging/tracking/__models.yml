version: 2

models:
  - name: stg_tracking__event
    description: >
      Pivot des événements de tracking front (source `analytics_raw.tracking_event`). Normalise les colonnes
      communes et extrait du JSONB `properties` les propriétés partagées (clés de liaison, versioning, contexte
      device/geo PostHog, acquisition, flag interne). Conserve `properties` brut pour les modèles par-event.
      Exclut les événements système PostHog (préfixe `$`). Aucun filtrage des utilisateurs internes ici :
      le staging reste exhaustif, l'exclusion est appliquée à partir des intermediate.
    columns:
      - name: event_uuid
        description: Identifiant unique de l'événement (PostHog).
        tests:
          - not_null
          - unique
      - name: event_name
        description: Nom de l'événement métier (ex. `quiz.started`).
        tests:
          - not_null
      - name: event_at
        description: Horodatage d'émission de l'événement.
        tests:
          - not_null
      - name: is_internal_user
        description: Vrai si l'événement porte le flag `internal_user` (membre de l'équipe). Jamais nul.
        tests:
          - not_null
      - name: is_cookieless_mode
        description: >
          Vrai si l'événement a été émis sans consentement cookies (`$cookieless_mode` posé par PostHog,
          absent et non `false` sur les autres événements). Jamais nul. En mode cookieless, le front ne pose
          pas la super property `quiz_session_id` : aucune conversion backend n'est rattachable.
        tests:
          - not_null
      - name: device_type
        description: Type d'appareil PostHog (`$device_type`), ex. Mobile / Desktop / Tablet.
      - name: quiz_attempt_id
        description: >
          Tentative de quiz, présente sur tout le tunnel. Avec cookies : UUID posé par le front (super
          property). Sans cookies, le front ne le pose pas : tentative RECONSTITUÉE
          `cookieless:<session PostHog>:<n>`, où n est le numéro du `quiz.started` en cours dans la session
          PostHog ; null avant le premier `quiz.started`. LIMITE : un consentement donné en plein quiz coupe la
          tentative en deux (moitié reconstituée avec le démarrage, moitié avec le vrai UUID sans démarrage) ;
          2 cas sur 310 tentatives en septembre 2026.
      - name: quiz_attempt_id_source
        description: >
          Origine de `quiz_attempt_id` : `property` (super property, visiteur avec cookies), `session`
          (reconstitué depuis la session PostHog, visiteur sans cookies), null si aucune tentative.
        tests:
          - accepted_values:
              arguments:
                values: ['property', 'session']
      - name: quiz_session_id
        description: >
          Identifiant du scoring backend (`userScoringId` = `user_scoring_id`), présent sur les events post-quiz.
          Lu en priorité dans la super property `quiz_session_id` ; à défaut, extrait de l'URL
          (`/results/<id>`, `/results/<id>/missions/<mission>`). Le repli rattache les visiteurs SANS cookies,
          dont le front retire la super property mais dont PostHog enregistre l'URL. RUPTURE DE SÉRIE à la mise en production du repli par l'URL des résultats (octobre 2026) : les events
          cookieless des pages de résultats portent désormais un `quiz_session_id`.
      - name: quiz_session_id_source
        description: >
          Origine de `quiz_session_id` : `property` (super property, visiteur avec cookies ou accès direct à
          `/results/<id>`), `url` (repli sur l'URL, en pratique visiteur sans cookies), null si aucun id.
        tests:
          - accepted_values:
              arguments:
                values: ['property', 'url']
      - name: quiz_version
        description: Version du quiz ayant émis l'événement.
      - name: utm_term
        description: >
          `utm_term` capté par PostHog (mot-clé SEA). Comme les autres UTM, super property posée à
          l'atterrissage, valeur brute non nettoyée.
      - name: utm_content
        description: >
          `utm_content` capté par PostHog (variante d'annonce). Valeur brute.
      - name: gclid
        description: >
          Identifiant de clic Google Ads (auto-tagging), capté par PostHog dans l'URL d'arrivée. Opaque
          (seul Google sait le décoder), sert de marqueur « trafic Google payant » et de clé pour un
          éventuel rapprochement futur avec un export Google Ads.
      - name: fbclid
        description: Identifiant de clic Meta, même logique que `gclid`.

  - name: stg_tracking__quiz_started
    description: Entrée du tunnel quiz (`quiz.started`), événement de référence de tous les ratios.
    columns:
      - name: event_uuid
        tests:
          - not_null
          - unique
      - name: quiz_attempt_id
        description: UUID de la tentative, généré à cet événement.
        tests:
          - not_null
      - name: entry_source
        description: Origine d'entrée dans le tunnel.
        tests:
          - accepted_values:
              values: ["homepage_cta", "direct", "missions_list", "change_results_cta", "external"]

  - name: stg_tracking__quiz_step_completed
    description: Étape de quiz validée (`quiz.step_completed`), base du funnel d'abandon.
    columns:
      - name: event_uuid
        tests:
          - not_null
          - unique
      - name: quiz_attempt_id
        tests:
          - not_null
      - name: step_name
        description: Nom de l'étape validée.
        tests:
          - not_null
      - name: step_index
        description: Position 1-based dans la séquence visible.
      - name: geo_postcode
        description: >
          Code postal DÉCLARÉ à l'étape `localisation` (JSON `properties`). Null sur les
          autres étapes. À ne pas confondre avec la géo GeoIP de PostHog.
      - name: geo_lat
        description: Latitude déclarée à l'étape `localisation`. Null sinon.
      - name: geo_lon
        description: Longitude déclarée à l'étape `localisation`. Null sinon.
      - name: geo_country_code
        description: Code pays déclaré à l'étape `localisation` (ex. `fr`). Null sinon.

  - name: stg_tracking__quiz_completed
    description: Fin du quiz (`quiz.completed`). Fait le lien `quiz_attempt_id` ↔ `quiz_session_id`.
    columns:
      - name: event_uuid
        tests:
          - not_null
          - unique
      - name: quiz_attempt_id
        tests:
          - not_null
      - name: quiz_session_id
        description: >
          Identifiant backend (`userScoringId`), clé de jointure analytics. Posé à la complétion pour les
          visiteurs avec cookies ; toujours null pour les tentatives sans cookies (`quiz_attempt_id_source =
          'session'`), la page du quiz n'ayant pas l'id dans son URL : il est repris du premier `results.viewed`
          dans `int_tracking_quiz_session`. Test limité aux visiteurs avec cookies.
        tests:
          - not_null:
              config:
                where: "quiz_attempt_id_source = 'property'"
      - name: quiz_attempt_id_source
        description: Origine de `quiz_attempt_id` (`property` avec cookies, `session` sans), voir `stg_tracking__event`.
      - name: completion_type
        description: Type de complétion.
        tests:
          - accepted_values:
              values: ["full", "shortcut"]
      - name: statut
        description: Statut déclaré par l'utilisateur.
        tests:
          - accepted_values:
              values: ["lyceen", "etudiant", "demandeur_emploi", "actif", "retraite", "autre"]

  - name: stg_tracking__results_viewed
    description: Affichage de la page de résultats (`results.viewed`).
    columns:
      - name: event_uuid
        tests:
          - not_null
          - unique
      - name: quiz_session_id
        tests:
          - not_null
      - name: has_results
        description: Faux si aucune mission retournée.
      - name: pinned_count
        description: >
          Nombre de missions « pinned » affichées. N'est plus émis depuis la refonte des résultats du
          17/09/2026 (liste paginée + carte) ; conservé pour l'historique.
      - name: page_size
        description: Nombre de missions par page de la liste de résultats (depuis la refonte du 17/09/2026).
      - name: total_pages
        description: Nombre de pages de la liste de résultats (depuis la refonte du 17/09/2026).
      - name: previous_quiz_session_id
        description: >
          `quiz_session_id` du scoring précédent, présent uniquement quand `results.viewed` est ré-émis après
          un re-scoring par les filtres de la page de résultats ; l'événement porte alors le NOUVEAU
          `quiz_session_id`. Null sinon.

  - name: stg_tracking__mission_clicked
    description: Clic sur une carte mission (`mission.clicked`), base des breakdowns rang/distance/section.
    columns:
      - name: event_uuid
        tests:
          - not_null
          - unique
      - name: mission_id
        tests:
          - not_null
      - name: section
        description: >
          Section d'où provient le clic. Résultats classés : `pinned` / `other` jusqu'à la refonte du
          17/09/2026, puis `list` (liste paginée) / `map` (carte). Aussi `similar`, `homepage_examples`,
          `missions_list`, `mission_detail` et les sections de landing `landing_*` (dynamiques, exclues du test).
        tests:
          - accepted_values:
              arguments:
                values:
                  - "pinned"
                  - "other"
                  - "list"
                  - "map"
                  - "homepage_examples"
                  - "missions_list"
                  - "similar"
                  - "mission_detail"
              config:
                where: "section not like 'landing%'"
      - name: rank
        description: >
          Rang ABSOLU de la mission dans le scoring (continue au-delà de 10 dans la liste paginée). Null
          hors résultats classés.
      - name: page_number
        description: >
          Numéro de la page de la liste de résultats d'où provient le clic (depuis la refonte du 17/09/2026).
          Null hors résultats paginés (missions similaires, homepage, liste /missions…).
      - name: entry_page
        description: Page depuis laquelle le clic est émis.
        tests:
          - accepted_values:
              values: ["results", "homepage", "missions_list"]

  - name: stg_tracking__mission_detail_viewed
    description: Consultation d'une fiche mission (`mission_detail.viewed`).
    columns:
      - name: event_uuid
        tests:
          - not_null
          - unique
      - name: mission_id
        tests:
          - not_null
      - name: entry_source
        description: Origine de la consultation.
        tests:
          - accepted_values:
              values: ["results_pinned", "results_other", "missions_list", "homepage", "direct"]

  - name: stg_tracking__page_viewed
    description: Visite d'une page (`page.viewed`), utilisé en agrégé comme dénominateur du trafic.
    columns:
      - name: event_uuid
        tests:
          - not_null
          - unique
      - name: page_name
        description: Page visitée (discriminant).
        tests:
          - not_null
          - accepted_values:
              values: ["homepage", "missions_list"]
