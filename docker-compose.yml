version: "3.9"

services:
  postgres-analytics:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: api-engagement-analytics
    ports:
      - "5431:5432"
    volumes:
      - postgres-analytics-data:/var/lib/postgresql/data

  postgres-core:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: api-engagement-core
    ports:
      - "5433:5432"
    volumes:
      - postgres-core-data:/var/lib/postgresql/data

  # CMS Strapi (POC) : landings et pages éditoriales de plateform. Admin sur http://localhost:1337/admin.
  # Secrets ci-dessous : valeurs de dev local uniquement.
  postgres-cms:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    ports:
      - "5434:5432"
    volumes:
      - postgres-cms-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  cms:
    build:
      context: ./cms
    depends_on:
      - postgres-cms
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres-cms
      APP_KEYS: dev-key-1,dev-key-2,dev-key-3,dev-key-4
      ADMIN_JWT_SECRET: dev-admin-jwt-secret
      API_TOKEN_SALT: dev-api-token-salt
      TRANSFER_TOKEN_SALT: dev-transfer-token-salt
      ENCRYPTION_KEY: dev-encryption-key
      JWT_SECRET: dev-jwt-secret
      PLATEFORM_URL: http://localhost:5173
      PREVIEW_SECRET: dev-preview-secret
      # Jeton lecture seule de plateform, créé de façon déterministe par `npm run seed`.
      CMS_API_TOKEN: dev-cms-read-token
    volumes:
      - ./cms:/opt/app
      - /opt/app/node_modules
      # Images des landings existantes, reprises par le script de seed.
      - ./plateform/app/assets:/seed-assets:ro
    ports:
      - "1337:1337"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      - postgres-core
    environment:
      PORT: 3002
      DATABASE_URL_CORE: postgres://user:password@postgres-core:5432/api-engagement-core
      WORKER_URL: http://worker:3004
      TYPESENSE_HOST: typesense
    volumes:
      - ./api:/workspace/api
      - api-node-modules:/workspace/api/node_modules
      - ./packages/taxonomy:/workspace/packages/taxonomy
      - ./packages/dto:/workspace/packages/dto
    ports:
      - "3002:3002"

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile.worker
    depends_on:
      - postgres-core
    environment:
      PORT_WORKER: 3004
      ENV: development
      DATABASE_URL_CORE: postgres://user:password@postgres-core:5432/api-engagement-core
      WORKER_URL: http://worker:3004
      TYPESENSE_HOST: typesense
    volumes:
      - ./api:/workspace/api
      - api-node-modules:/workspace/api/node_modules
      - ./packages/taxonomy:/workspace/packages/taxonomy
    ports:
      - "3004:3004"

  plateform:
    build:
      context: .
      dockerfile: plateform/Dockerfile
    depends_on:
      - api
    env_file:
      - ./plateform/.env
    environment:
      VITE_API_URL: http://localhost:3002
      SERVER_API_URL: http://api:3002
      VITE_ENV: development
      CMS_URL: http://cms:1337
      CMS_PUBLIC_URL: http://localhost:1337
      CMS_API_TOKEN: dev-cms-read-token
      CMS_PREVIEW_SECRET: dev-preview-secret
    volumes:
      - ./plateform:/workspace/plateform
      - /workspace/plateform/node_modules
      - ./packages/taxonomy:/workspace/packages/taxonomy
      - ./packages/dto:/workspace/packages/dto
    ports:
      - "3005:3005"

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      - api
    environment:
      PORT: 3000
      VITE_API_URL: http://localhost:3002
    volumes:
      - ./app:/workspace/app
      - ./packages/dto:/workspace/packages/dto
      - /workspace/app/node_modules
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  typesense-setup:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      typesense:
        condition: service_started
      postgres-core:
        condition: service_started
    environment:
      DATABASE_URL_CORE: postgres://user:password@postgres-core:5432/api-engagement-core
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: xyz
      TYPESENSE_MISSION_COLLECTION: missions
    volumes:
      - ./api:/workspace/api
      - api-node-modules:/workspace/api/node_modules
      - ./packages/taxonomy:/workspace/packages/taxonomy
      - ./packages/dto:/workspace/packages/dto
    command:
      [
        "sh",
        "-c",
        "sleep 20 && npx ts-node src/jobs/run-job.ts setup-search-collections",
      ]
    restart: "no"

  widget:
    build:
      context: .
      dockerfile: widget/Dockerfile
    depends_on:
      - api
    environment:
      API_URL: http://localhost:3002
      ENV: development
    volumes:
      - ./widget:/workspace/widget
      - /workspace/widget/node_modules
    ports:
      - "3003:3003"

  typesense:
    image: typesense/typesense:30.2
    restart: always
    command: --data-dir /data --api-key=xyz --enable-cors
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data

volumes:
  api-node-modules:
  postgres-analytics-data:
  postgres-core-data:
  postgres-cms-data:
  typesense-data:
