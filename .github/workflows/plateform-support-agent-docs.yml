name: Plateform support agent documentation

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      force_all:
        description: Regenerate every documentation chapter
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: plateform-support-agent-docs
  cancel-in-progress: false

jobs:
  generate:
    if: vars.PLATEFORM_SUPPORT_DOCS_EXTERNAL_GENERATION_ENABLED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/scripts/package-lock.json

      - name: Install generator dependencies
        run: npm ci --prefix tools/scripts

      - name: Generate documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PLATEFORM_SUPPORT_DOCS_OPENAI_MODEL: ${{ vars.PLATEFORM_SUPPORT_DOCS_OPENAI_MODEL || 'gpt-4o' }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          ARGS=(--summary-file /tmp/plateform-support-agent-pr.md)
          if [[ "$FORCE_ALL" == "true" ]]; then
            ARGS+=(--all)
          fi
          npm run generate-docs-plateform-support-agent --prefix tools/scripts -- "${ARGS[@]}"

      - name: Validate documentation
        run: npm run check-docs-plateform-support-agent --prefix tools/scripts

      - name: Detect documentation changes
        id: changes
        run: |
          if git diff --quiet -- plateform/docs/support-agent; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pull request body
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            cat /tmp/plateform-support-agent-pr.md
            echo
            echo "## Validation automatique"
            echo
            echo "- [x] Structure documentaire valide"
            echo "- [x] Références vers les sources valides"
            echo "- [x] Aucun secret détecté par les contrôles du générateur"
            echo "- [x] Aucun fichier hors périmètre documentaire modifié"
            echo
            echo "## Relecture PM"
            echo
            echo "- [ ] Les règles décrites correspondent au fonctionnement du produit"
            echo "- [ ] Aucune règle importante ne semble manquer"
            echo "- [ ] Les conditions et effets sont correctement distingués"
            echo "- [ ] Le niveau de détail est suffisant"
            echo "- [ ] Le diff ne contient pas de réécriture inutile"
          } > /tmp/plateform-support-agent-pr-body.md

      - name: Commit and push documentation
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: github-actions/chore/plateform-support-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add plateform/docs/support-agent
          git commit -m "chore(doc): update plateform support documentation"
          git push --force-with-lease origin "HEAD:$BRANCH"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: github-actions/chore/plateform-support-docs
          REVIEWER: ${{ vars.PLATEFORM_SUPPORT_DOCS_REVIEWER }}
        run: |
          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url')
          if [[ -z "$PR_URL" ]]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(doc): update plateform support documentation" \
              --body-file /tmp/plateform-support-agent-pr-body.md)
          else
            gh pr edit "$PR_URL" --body-file /tmp/plateform-support-agent-pr-body.md
          fi

          if [[ -n "$REVIEWER" ]]; then
            gh pr edit "$PR_URL" --add-reviewer "$REVIEWER"
          fi

          echo "Pull request: $PR_URL"
