name: Analytics checks

on:
  workflow_call:
    inputs:
      dbt:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  checks:
    name: Analytics checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.dbt && 'postgres:15' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        id: install
        run: npm ci --workspace analytics --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        if: ${{ !cancelled() && inputs.dbt && steps.install.outcome == 'success' }}
        with:
          python-version: "3.11"

      - name: Install dbt and SQLFluff
        id: python-dependencies
        if: ${{ !cancelled() && inputs.dbt && steps.install.outcome == 'success' && steps.python.outcome == 'success' }}
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r analytics/dbt/analytics/requirements.txt

      - name: Run ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint --workspace analytics

      - name: Build
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: npm --workspace analytics run build

      - name: Prepare temporary databases
        id: database
        if: ${{ !cancelled() && inputs.dbt && steps.install.outcome == 'success' }}
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE analytics;'

      - name: Check dbmate migrations
        id: migrations
        if: ${{ !cancelled() && inputs.dbt && steps.install.outcome == 'success' && steps.database.outcome == 'success' }}
        env:
          DATABASE_URL_ANALYTICS: postgresql://postgres:postgres@localhost:5432/analytics?sslmode=disable
        run: npm --workspace analytics run db:migrate

      - name: Check dbt compile
        if: ${{ !cancelled() && inputs.dbt && steps.migrations.outcome == 'success' && steps.python-dependencies.outcome == 'success' }}
        working-directory: analytics
        env:
          DATABASE_URL_ANALYTICS: postgresql://postgres:postgres@localhost:5432/analytics
        run: ./scripts/dbt-env.sh compile

      - name: Lint dbt project
        if: ${{ !cancelled() && inputs.dbt && steps.python-dependencies.outcome == 'success' }}
        run: sqlfluff lint --config analytics/dbt/analytics/.sqlfluff analytics/dbt/analytics/models
