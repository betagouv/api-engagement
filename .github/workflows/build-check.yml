name: Build Check (TypeScript)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      analytics: ${{ steps.filter.outputs.analytics }}
      widget: ${{ steps.filter.outputs.widget }}
      plateform: ${{ steps.filter.outputs.plateform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'packages/**'
            app:
              - 'app/**'
              - 'packages/**'
            analytics:
              - 'analytics/**'
            widget:
              - 'widget/**'
            plateform:
              - 'plateform/**'
              - 'packages/**'

  api-build:
    name: API build
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci --workspace api --include-workspace-root=false --prefer-offline --no-audit --no-fund
      - name: Build (tsc)
        run: npm --workspace api run build

  app-build:
    name: App build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci --workspace app --include-workspace-root=false --prefer-offline --no-audit --no-fund
      - name: Build (vite)
        run: npm --workspace app run build

  analytics-build:
    name: Analytics build
    needs: changes
    if: needs.changes.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci --workspace analytics --include-workspace-root=false --prefer-offline --no-audit --no-fund
      - name: Build (tsc)
        run: npm --workspace analytics run build

  widget-build:
    name: Widget build
    needs: changes
    if: needs.changes.outputs.widget == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci --workspace widget --include-workspace-root=false --prefer-offline --no-audit --no-fund
      - name: Build (next)
        run: npm --workspace widget run build

  plateform-build:
    name: Plateform build
    needs: changes
    if: needs.changes.outputs.plateform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci --workspace plateform --include-workspace-root=false --prefer-offline --no-audit --no-fund
      - name: Build (react-router)
        run: npm --workspace plateform run build
