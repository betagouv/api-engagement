name: Lint

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dbt: ${{ steps.filter.outputs.dbt }}
      api: ${{ steps.filter.outputs.api }}
      eslint: ${{ steps.filter.outputs.eslint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            dbt:
              - 'analytics/dbt/**'
            api:
              - 'api/**'
            eslint:
              - '{api,app,analytics,widget,plateform,packages}/**/*.{js,jsx,cjs,mjs,ts,tsx,cts,mts}'
              - '**/eslint.config.*'
              - '**/.eslintrc*'
              - '**/.eslintignore'
              - '**/tsconfig*.json'
              - '**/package.json'
              - 'package-lock.json'
              - '**/.npmrc'
              - '.github/workflows/lint.yml'

  lint:
    name: Run ESLint
    needs: changes
    if: needs.changes.outputs.eslint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

  lint-openapi:
    name: Lint OpenAPI spec
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli lint --config api/redocly.yaml

  lint-analytics-models:
    name: Run SQLFluff on Analytics models
    needs: changes
    if: needs.changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install SQLFluff
        run: pip install --no-cache-dir -r analytics/dbt/analytics/requirements.txt

      - name: Lint dbt project
        run: sqlfluff lint --config analytics/dbt/analytics/.sqlfluff analytics/dbt/analytics/models
