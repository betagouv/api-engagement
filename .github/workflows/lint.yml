name: Lint

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dbt: ${{ steps.filter.outputs.dbt }}
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      analytics: ${{ steps.filter.outputs.analytics }}
      widget: ${{ steps.filter.outputs.widget }}
      plateform: ${{ steps.filter.outputs.plateform }}
      dto: ${{ steps.filter.outputs.dto }}
      taxonomy: ${{ steps.filter.outputs.taxonomy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            dbt:
              - 'analytics/dbt/**'
            api:
              - 'api/**'
              - 'packages/**'
            app:
              - 'app/**'
              - 'packages/**'
            analytics:
              - 'analytics/**'
            widget:
              - 'widget/**'
            plateform:
              - 'plateform/**'
              - 'packages/**'
            dto:
              - 'packages/dto/**'
            taxonomy:
              - 'packages/taxonomy/**'

  api-checks:
    name: API checks
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        id: install
        run: npm ci --workspace api --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint --workspace api

      - name: Build
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: npm --workspace api run build

      - name: Lint OpenAPI spec
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes @redocly/cli lint --config api/redocly.yaml

      - name: Generate Prisma clients
        id: prisma
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: npm --workspace api run prisma:generate

      - name: Run unit tests
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.prisma.outcome == 'success' }}
        run: npm --workspace api run test:unit

      - name: Run integration tests
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.prisma.outcome == 'success' }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: npm --workspace api run test:integration

  app-checks:
    name: App checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        id: install
        run: npm ci --workspace app --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint --workspace app

      - name: Build
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: npm --workspace app run build

      - name: Check Chrome
        id: chrome
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: google-chrome --version

      - name: Run functional E2E tests
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' && steps.chrome.outcome == 'success' }}
        run: npm --workspace app run test:e2e:functional

      - name: Run accessibility tests
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' && steps.chrome.outcome == 'success' }}
        run: npm --workspace app run test:e2e:a11y

  widget-checks:
    name: Widget checks
    needs: changes
    if: needs.changes.outputs.widget == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        id: install
        run: npm ci --workspace widget --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint --workspace widget

      - name: Build
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: npm --workspace widget run build

  plateform-checks:
    name: Plateform checks
    needs: changes
    if: needs.changes.outputs.plateform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        id: install
        run: npm ci --workspace plateform --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint --workspace plateform

      - name: Build
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: npm --workspace plateform run build

      - name: Run unit tests
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: npm --workspace plateform run test

      - name: Check Chrome
        id: chrome
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: google-chrome --version

      - name: Run accessibility tests
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' && steps.chrome.outcome == 'success' }}
        run: npm --workspace plateform run test:e2e:a11y

  analytics-checks:
    name: Analytics checks
    needs: changes
    if: needs.changes.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        id: install
        run: npm ci --workspace analytics --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint --workspace analytics

      - name: Build
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: npm --workspace analytics run build

  lint-dto:
    name: Run ESLint (dto)
    needs: changes
    if: needs.changes.outputs.dto == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci --workspace packages/dto --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint --workspace packages/dto

  taxonomy-checks:
    name: Taxonomy checks
    needs: changes
    if: needs.changes.outputs.taxonomy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        id: install
        run: npm ci --workspace packages/taxonomy --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint --workspace packages/taxonomy

      - name: Run unit tests
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: npm --workspace @engagement/taxonomy run test

  lint-analytics-models:
    name: Run SQLFluff on Analytics models
    needs: changes
    if: needs.changes.outputs.dbt == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install SQLFluff
        run: pip install --no-cache-dir -r analytics/dbt/analytics/requirements.txt

      - name: Lint dbt project
        run: sqlfluff lint --config analytics/dbt/analytics/.sqlfluff analytics/dbt/analytics/models
