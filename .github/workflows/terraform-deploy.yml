name: Deploy to Scaleway

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      environment:
        required: false
        type: string
        description: "Force environment (sandbox, production, staging)"
    secrets:
      DATABASE_URL_CORE:
        required: false
      SCW_ACCESS_KEY:
        required: false
      SCW_PROJECT_ID:
        required: false
      SCW_SECRET_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  set-env:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Set environment based on input or branch
        id: set-env
        env:
          HEAD_BRANCH: ${{ inputs.branch || github.ref_name }}
          FORCED_ENV: ${{ inputs.environment }}
        run: |
          if [[ -n "$FORCED_ENV" ]]; then
            echo "environment=$FORCED_ENV" >> $GITHUB_OUTPUT
          elif [[ "$HEAD_BRANCH" == 'main' ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to Scaleway
    needs: set-env
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.set-env.outputs.environment_name }}
      url: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.1
          terraform_wrapper: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Scaleway credentials
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83 # v0.0.3
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_PROJECT_ID }}

      # AWS_ env are required for the S3 backend, with scaleway credentials
      # See https://registry.terraform.io/providers/scaleway/scaleway/latest/docs#store-terraform-state-on-scaleway-s3-compatible-object-storage
      - name: Export Scaleway environment variables
        run: |
          echo "SCW_ACCESS_KEY=${{ secrets.SCW_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "SCW_SECRET_KEY=${{ secrets.SCW_SECRET_KEY }}" >> $GITHUB_ENV
          echo "SCW_DEFAULT_PROJECT_ID=${{ secrets.SCW_PROJECT_ID }}" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=${{ secrets.SCW_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.SCW_SECRET_KEY }}" >> $GITHUB_ENV
          echo "TF_VAR_project_id=${{ secrets.SCW_PROJECT_ID }}" >> $GITHUB_ENV

      - name: Set image tag from branch
        id: get-tag
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")

          if [[ "${{ needs.set-env.outputs.environment_name }}" == "production" || "${{ needs.set-env.outputs.environment_name }}" == "sandbox" ]]; then
            IMAGE_TAG="$LATEST_TAG"
          else
            IMAGE_TAG="${LATEST_TAG}-${SHORT_SHA}"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using image tag: ${IMAGE_TAG}"
          echo "Environment: ${{ needs.set-env.outputs.environment_name }}"
          echo "Will use images tagged as: ${{ needs.set-env.outputs.environment_name }}-${IMAGE_TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install API dependencies
        run: npm ci --workspace api --include-workspace-root=false

      - name: Build functions bundles
        run: npm --prefix functions run build

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Workspace
        working-directory: ./terraform
        run: terraform workspace select "${{ needs.set-env.outputs.environment_name }}" || terraform workspace new "${{ needs.set-env.outputs.environment_name }}"

      - name: Run Prisma migrations (API)
        env:
          DATABASE_URL_CORE: ${{ secrets.DATABASE_URL_CORE }}
          SSH_TUNNEL_ENABLED: ${{ vars.SSH_TUNNEL_ENABLED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SSH_TUNNEL_ENABLED" != "true" ]]; then
            npm --workspace api run prisma:migrate:deploy
            exit 0
          fi

          umask 077
          tunnel_dir="$(mktemp -d)"
          export SSH_TUNNEL_CONTROL_PATH="$tunnel_dir/ssh.sock"
          trap 'if [[ -S "$SSH_TUNNEL_CONTROL_PATH" ]]; then ssh -S "$SSH_TUNNEL_CONTROL_PATH" -O exit "bastion@${SSH_TUNNEL_BASTION_HOST}" >/dev/null 2>&1 || true; fi; rm -rf "$tunnel_dir"' EXIT

          # La sortie sensible reste en mémoire et ne doit pas être affichée.
          tunnel_config="$(terraform -chdir=terraform output -json ssh_tunnel_env_vars)"
          jq -e 'type == "object" and (.SSH_TUNNEL_ENABLED == "true" or .SSH_TUNNEL_ENABLED == "false") and all(to_entries[]; (.key | test("^SSH_TUNNEL_[A-Z_]+$")) and (.value | type == "string"))' <<< "$tunnel_config" > /dev/null
          while IFS= read -r name; do
            value="$(jq -er --arg name "$name" '.[$name]' <<< "$tunnel_config")"
            export "$name=$value"
          done < <(jq -r 'keys[] | select(. != "SSH_TUNNEL_ENABLED")' <<< "$tunnel_config")
          unset tunnel_config value

          if [[ -n "${SSH_TUNNEL_PRIVATE_KEY:-}" ]]; then
            masked_key="${SSH_TUNNEL_PRIVATE_KEY//%/%25}"
            masked_key="${masked_key//$'\r'/%0D}"
            masked_key="${masked_key//$'\n'/%0A}"
            printf '::add-mask::%s\n' "$masked_key"
            unset masked_key
          fi

          export SSH_TUNNEL_URL_ENV=DATABASE_URL_CORE
          sh docker/ssh-tunnel-entrypoint.sh npm --workspace api run prisma:migrate:deploy

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var-file=envs/${{ needs.set-env.outputs.environment_name }}.tfvars \
            -var="image_tag=${{ steps.get-tag.outputs.image_tag }}" \
            -var="project_id=${{ secrets.SCW_PROJECT_ID }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Output Deployment URLs
        working-directory: ./terraform
        run: |
          echo "API Endpoint: $(terraform output -raw api_endpoint)"
          echo "App Endpoint: $(terraform output -raw app_endpoint)"
          echo "Benevolat Widget Endpoint: $(terraform output -raw benevolat_endpoint)"
          echo "Volontariat Widget Endpoint: $(terraform output -raw volontariat_endpoint)"
