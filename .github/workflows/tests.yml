name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  project-checks:
    uses: ./.github/workflows/project-checks.yml
    permissions:
      contents: read
      pull-requests: read

  changes:
    name: Detect changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      api_migrations: ${{ steps.filter.outputs.api_migrations }}
      widget: ${{ steps.filter.outputs.widget }}
      api_prisma_schema: ${{ steps.filter.outputs.api_prisma_schema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api_migrations:
              - 'api/prisma/**'
              - 'api/prisma.config.ts'
            widget:
              - 'widget/**'
            api_prisma_schema:
              - 'api/prisma/schema.prisma'

  api-migrations:
    name: Verify API migrations
    needs: changes
    if: needs.changes.outputs.api_migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci --workspace api --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: Prepare temporary databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE core;'

      - name: Check Prisma migrations
        env:
          DATABASE_URL_CORE: postgresql://postgres:postgres@localhost:5432/core
        run: npm --workspace api run prisma:migrate:deploy

  analytics-export-job:
    name: Verify analytics export job
    needs: changes
    if: needs.changes.outputs.api_prisma_schema == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci --workspace api --workspace analytics --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: Prepare temporary databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE core;'
          psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE analytics;'

      - name: Apply API Prisma migrations
        env:
          DATABASE_URL_CORE: postgresql://postgres:postgres@localhost:5432/core
        run: npm --workspace api run prisma:migrate:deploy

      - name: Apply Analytics migrations
        env:
          DATABASE_URL_ANALYTICS: postgresql://postgres:postgres@localhost:5432/analytics?sslmode=disable
        run: npm --workspace analytics run db:migrate

      - name: Run analytics export job
        env:
          DATABASE_URL_CORE: postgresql://postgres:postgres@localhost:5432/core
          DATABASE_URL_ANALYTICS: postgresql://postgres:postgres@localhost:5432/analytics?sslmode=disable
          ENV: development
        run: npm --workspace analytics run job -- export-to-analytics-raw

  widgets-tests:
    name: Widget Tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.widget == 'true'
    runs-on: ubuntu-latest
    container:
      # Garder la version alignée sur Playwright dans package-lock.json.
      image: mcr.microsoft.com/playwright:v1.63.0-resolute
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci --workspace widget --include-workspace-root=false --prefer-offline --no-audit --no-fund

      - name: Run tests
        run: npm --workspace widget run test:e2e -- --shard=${{ matrix.shard }}/2
        env:
          # Firefox exige que HOME appartienne à l’utilisateur du conteneur.
          HOME: /root

      - name: Upload HTML test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-widget-${{ matrix.shard }}
          path: widget/tests/e2e/_playwright-report
          retention-days: 30
