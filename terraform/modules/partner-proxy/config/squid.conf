http_port 0.0.0.0:3128
include /etc/squid/egress.conf
visible_hostname partner-proxy

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm Proxy partenaires
auth_param basic credentialsttl 5 minutes
acl authenticated proxy_auth REQUIRED
acl tunnel method CONNECT
acl tls_port port 443

# Interdiction des destinations locales, privées, réservées et du proxy lui-même.
acl forbidden_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl forbidden_dst dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24
acl forbidden_dst dst 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24
acl forbidden_dst dst 224.0.0.0/4 240.0.0.0/4 ::/0

acl local_names dstdomain -n .localhost .local .internal

http_access deny manager
http_access deny !tunnel
http_access deny !tls_port
http_access deny local_names
http_access deny forbidden_dst
http_access deny proxy_self
http_access allow authenticated
http_access deny all

cache deny all
# Pas d'URL, de données partenaires ou d'identifiants dans les logs d'accès.
access_log none
cache_store_log none
cache_log /var/log/squid/cache.log
connect_timeout 15 seconds
request_timeout 30 seconds
read_timeout 5 minutes

pinger_enable off
